name: Build Android TV APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and lint
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Prepare draft APK for private signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle)
          APK_TAG="android-v${APK_VERSION}"
          if ! gh release view "$APK_TAG" >/dev/null 2>&1; then
            gh release create "$APK_TAG" --draft --title "Maida TV Signage ${APK_VERSION}" --notes "APK signing in progress."
          fi
          if [ "$(gh release view "$APK_TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release upload "$APK_TAG" android/app/build/outputs/apk/release/app-release-unsigned.apk --clobber
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: maida-tv-signage-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-release.*
